# Fly.io configuration for FastAPI Backend
# Deploy with: cd backend && flyctl deploy --config ../fly.backend.toml

app = "rarenet-backend"
primary_region = "sjc"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  # Set these via flyctl secrets:
  # flyctl secrets set CYBORGDB_URL=https://rarenet-cyborgdb.fly.dev
  # flyctl secrets set CYBORGDB_API_KEY=your_key
  # flyctl secrets set JWT_SECRET_KEY=your_random_secret
  # flyctl secrets set CYBORGDB_MASTER_INDEX_KEY=your_random_hex_key
  PORT = "8000"
  # Disables POST /auth/seed-demo-users, which otherwise lets anyone plant a
  # well-known admin login (admin@rarenet.org / admin123) on a fresh deploy.
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "30s"
    timeout = "10s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

