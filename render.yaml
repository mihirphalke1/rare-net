services:
  # 1. The Backend API (FastAPI)
  - type: web
    name: rare-net-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CYBORGDB_URL
        fromService:
          type: web
          name: rare-net-cyborgdb
          property: url
      - key: CYBORGDB_API_KEY
        sync: false

  # 2. The CyborgDB Service (Docker)
  - type: web
    name: rare-net-cyborgdb
    env: docker
    dockerfilePath: ./cyborgdb.Dockerfile
    plan: free
    envVars:
      - key: CYBORGDB_API_KEY
        sync: false
      - key: CYBORGDB_DB_TYPE
        value: redis
      # Render Redis service name is resolvable as a hostname
      - key: CYBORGDB_CONNECTION_STRING
        value: host:rare-net-redis,port:6379,db:0

  # 3. Redis (Backing Store)
  - type: redis
    name: rare-net-redis
    plan: free
    ipAllowList: []
