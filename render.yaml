services:
  # 1. The Backend API (FastAPI)
  - type: web
    name: rare-net-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CYBORGDB_URL
        fromService:
          type: web
          name: rare-net-cyborgdb
          property: url
      - key: CYBORGDB_API_KEY
        sync: false # You will enter this in the Render Dashboard

  # 2. The CyborgDB Service (Docker)
  - type: web
    name: rare-net-cyborgdb
    env: docker
    dockerImage: cyborginc/cyborgdb-service:latest
    plan: free
    envVars:
      - key: CYBORGDB_API_KEY
        sync: false # You will enter this in the Render Dashboard
      - key: CYBORGDB_DB_TYPE
        value: redis
      - key: CYBORGDB_CONNECTION_STRING
        fromService:
          type: redis
          name: rare-net-redis
          property: connectionString

  # 3. Redis (Backing Store)
  - type: redis
    name: rare-net-redis
    plan: free
    ipAllowList: [] # Allow internal connections only
