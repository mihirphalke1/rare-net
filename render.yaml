services:
  # 1. Redis (State Store)
  - type: pserv
    name: redis
    env: docker
    image: redis:alpine
    plan: free
    ipAllowList: [] # Internal only

  # 2. CyborgDB (Vector Database)
  - type: web
    name: cyborgdb
    env: docker
    image: cyborginc/cyborgdb-service:latest
    plan: free
    envVars:
      - key: CYBORGDB_API_KEY
        generateValue: true
      - key: CYBORGDB_ENCRYPTION_KEY
        sync: false # User must set this in Dashboard
      - key: CYBORGDB_DB_TYPE
        value: redis
      - key: CYBORGDB_CONNECTION_STRING
        value: "host:redis,port:6379,db:0"
    healthCheckPath: /v1/health

  # 3. Backend (FastAPI)
  - type: web
    name: rare-net-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CYBORGDB_URL
        fromService:
          type: web
          name: cyborgdb
          property: url
      - key: CYBORGDB_API_KEY
        fromService:
          type: web
          name: cyborgdb
          envVarKey: CYBORGDB_API_KEY
      - key: CYBORGDB_ENCRYPTION_KEY
        sync: false # User must set this in Dashboard
